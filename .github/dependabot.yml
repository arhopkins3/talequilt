# Dependency updates (ADR 0019). Grouped weekly pull requests for each ecosystem; each one runs through
# every gate like any other pull request, and Alex merges it. Actions bumps keep the SHA pins current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
    # Major versions held back on purpose (ADR 0019). A grouped pull request is all or nothing, and the first
    # one (#22) failed at npm ci because typescript 7 is outside typescript-eslint's peer range (<6.1.0).
    # TypeScript majors are a planned upgrade Alex schedules, not a weekly surprise. @types/node tracks the
    # Node major the app runs on (engines in package.json and node-version in ci.yml), so it moves with them.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      nuget:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
