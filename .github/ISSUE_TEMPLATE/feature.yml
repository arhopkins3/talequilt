name: Feature
description: A change to the product or the pipeline. The spec agent turns this into a user story with testable acceptance criteria for gate G1.
title: "feat: "
labels: ["type/feature", "gate/needs-spec"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the author (or the pipeline) cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true when this is done. Prefer observable behaviour to implementation.
    validations:
      required: true
  - type: dropdown
    id: slice
    attributes:
      label: Product slice or pipeline phase
      options:
        - Pipeline
        - 1. Manuscript
        - 2. Book bible
        - 3. Illustration
        - 4. Layout
        - 5. Export
        - Operate
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Anything that must not change, and anything deliberately out of scope.
  - type: checkboxes
    id: risk
    attributes:
      label: Touches a guarded area
      description: Any tick means the change is never "small" and needs the security reviewer.
      options:
        - label: Sign-in or authorisation
        - label: Secrets, Key Vault or identities
        - label: Infrastructure (`infra/`) or `.github/`
        - label: AI model calls or prompts
        - label: Database schema
