# Deploy (ADR 0021). Runs after CI succeeds on main, or by hand from main. Publishes the container images for the
# commit CI tested, deploys staging, then deploys production behind gate G4: the production job carries the
# `production` GitHub environment, whose required reviewer is Alex, so it waits there until he approves. The two
# deploys are the same reusable workflow (deploy-environment.yml) with a different environment name, so what runs in
# production is exactly what ran in staging.
# Provenance: only a CI run for a push to this repository's main, or a manual run from main, may publish and deploy;
# CI also runs for pull requests, including ones from forks, and those must never reach the registry or Azure.
# Concurrency is per job, not per run: a production job waiting at G4 keeps its run in progress and would otherwise
# hold a run-wide lock, stopping the next merge from reaching staging until Alex answered.
# Every action is pinned to a commit SHA, with the tag it was taken from as a comment.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/arhopkins3/talequilt-api
  IMAGE_WORKER: ghcr.io/arhopkins3/talequilt-worker

jobs:
  images:
    name: Publish images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      head_sha: ${{ steps.tag.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - id: tag
        run: |
          echo "tag=sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - name: Restore (locked)
        run: dotnet restore TaleQuilt.slnx --locked-mode
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Publish the API and worker images, tagged with the commit and main
        run: |
          set -euo pipefail
          for p in Api Worker; do
            dotnet publish "src/TaleQuilt.$p/TaleQuilt.$p.csproj" -c Release -r linux-x64 --no-restore /t:PublishContainer \
              -p:ContainerRegistry="$REGISTRY" -p:ContainerImageTags='"${{ steps.tag.outputs.tag }};main"'
          done
          echo "Published $IMAGE_API and $IMAGE_WORKER as ${{ steps.tag.outputs.tag }} and main" >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Staging
    needs: images
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      head_sha: ${{ needs.images.outputs.head_sha }}
      image_tag: ${{ needs.images.outputs.tag }}

  production:
    # Gate G4: the `production` environment names Alex as required reviewer, so this job waits for his approval
    # after staging has passed. Nothing an agent can do approves it. Build pull request 3b adds the staging test
    # suites (Playwright, ZAP, axe) between staging and here.
    name: Production
    needs: [images, staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      head_sha: ${{ needs.images.outputs.head_sha }}
      image_tag: ${{ needs.images.outputs.tag }}
