# Publishes docs/ to GitHub Pages after CI passes on main (ADR 0014).
# The Factory Console (docs/index.html) and the map (docs/pipeline-map.html) live there.
# A deploy never runs ahead of CI: this workflow starts when the CI workflow completes on main,
# deploys only if CI succeeded, and deploys the exact commit CI tested.
# One-time setup by Alex: Settings, Pages, Source = GitHub Actions.
# Every action is pinned to a commit SHA, with the tag it was taken from as a comment (ADR 0019); Dependabot proposes bumps.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs to Pages
    # Manual runs deploy main as it is, whichever branch the run was started from; CI-triggered runs deploy only after a green CI run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI just tested, not whatever main points at by the time this job starts.
          # A manual run always deploys main, never the branch it was dispatched from.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
