# Security scanning (ADR 0019): CodeQL static analysis for C# and JavaScript/TypeScript, a secret scan over the
# full history, a CycloneDX bill of materials for .NET and npm, and an infrastructure scan that runs on infra/
# once Phase 3 writes Bicep. Job names are status check names: "CodeQL C#", "CodeQL JavaScript" and
# "Secret scan" become required on main; "SBOM" and "Infrastructure scan" report without blocking until Phase 3.
# Every action is pinned to a commit SHA, with the tag it was taken from as a comment; Dependabot proposes bumps.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, so new CodeQL queries and new secret patterns run against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            label: "C#"
            build-mode: manual
          - language: javascript-typescript
            label: JavaScript
            build-mode: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build for analysis (C# only; the same build CI runs)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore TaleQuilt.slnx --locked-mode
          dotnet build TaleQuilt.slnx --no-restore -c Release --nologo
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the whole history: a secret committed and then removed is still a leak
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false" # findings go to the job summary and log, not to pull request comments
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: CycloneDX for .NET (one per deployable project)
        run: |
          dotnet tool restore
          dotnet restore TaleQuilt.slnx --locked-mode
          mkdir -p sbom
          for p in Api Worker; do
            dotnet CycloneDX "src/TaleQuilt.$p/TaleQuilt.$p.csproj" --recursive --output sbom --filename "talequilt-$(echo $p | tr A-Z a-z).cdx.json" --output-format Json
          done
      - name: CycloneDX for npm
        working-directory: src/web
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file ../../sbom/talequilt-web.cdx.json
      - name: Summary
        run: |
          echo "## Software bill of materials (CycloneDX)" >> "$GITHUB_STEP_SUMMARY"
          for f in sbom/*.cdx.json; do
            n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components', [])))" "$f")
            echo "- \`$(basename "$f")\`: $n components" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  infra-scan:
    name: Infrastructure scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: bicep
        name: Is there infrastructure to scan yet?
        run: |
          if compgen -G "infra/**/*.bicep" > /dev/null || compgen -G "infra/*.bicep" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Bicep under infra/ yet; Phase 3 writes it. The scan runs on the first file." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.bicep.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: infra
          framework: bicep
          soft_fail: true # reports until Phase 3 makes it a gate (ADR 0019)
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
