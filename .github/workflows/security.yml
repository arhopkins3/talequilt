# Security scanning (ADR 0019): CodeQL static analysis for C# and JavaScript/TypeScript, a secret scan over the
# full history and the working tree, a CycloneDX bill of materials for .NET and npm, and an infrastructure scan
# that runs on infra/ once Phase 3 writes Bicep. Job names are status check names: "CodeQL C#", "CodeQL JavaScript"
# and "Secret scan" become required on main; "SBOM" and "Infrastructure scan" report without blocking until Phase 3.
# Every action is pinned to a commit SHA, with the tag it was taken from as a comment; Dependabot proposes bumps.
# The gitleaks binary is pinned by release version and SHA-256 and is bumped by hand (Dependabot does not see it).
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly: re-scan unchanged code with whatever scanner versions are pinned now, and keep the Security tab current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            label: "C#"
            build-mode: manual
          - language: javascript-typescript
            label: JavaScript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build for analysis (C# only; the same build CI runs)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore TaleQuilt.slnx --locked-mode
          dotnet build TaleQuilt.slnx --no-restore -c Release --nologo
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret committed and then removed is still a leak
      - name: Install gitleaks (release pinned by version and checksum)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz"
          echo "${{ env.GITLEAKS_SHA256 }}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version
      # The report is written outside the checkout. A report that holds any finding embeds gitleaks' full rule
      # list, and one rule's pattern matches another rule's, so a report inside the tree makes the working-tree
      # scan below report a second, false, leak (Phase 2 debrief, item 12).
      - name: Scan every commit in the history
        run: ./gitleaks git . --redact --no-banner --exit-code 1 --report-format sarif --report-path "$RUNNER_TEMP/gitleaks-history.sarif"
      - name: Scan the working tree (catches files that were never committed as such, for example generated ones)
        if: always()
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
      - name: Upload findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-history.sarif
          category: gitleaks

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: CycloneDX for .NET (one per deployable project)
        run: |
          dotnet tool restore
          dotnet restore TaleQuilt.slnx --locked-mode
          mkdir -p sbom
          for p in Api Worker; do
            dotnet CycloneDX "src/TaleQuilt.$p/TaleQuilt.$p.csproj" --recursive --output sbom --filename "talequilt-$(echo $p | tr A-Z a-z).cdx.json" --output-format Json
          done
      - name: CycloneDX for npm
        working-directory: src/web
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file ../../sbom/talequilt-web.cdx.json
      - name: Summary
        run: |
          echo "## Software bill of materials (CycloneDX)" >> "$GITHUB_STEP_SUMMARY"
          for f in sbom/*.cdx.json; do
            n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components', [])))" "$f")
            echo "- \`$(basename "$f")\`: $n components" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  infra-scan:
    name: Infrastructure scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bicep
        name: Is there infrastructure to scan yet?
        run: |
          if compgen -G "infra/**/*.bicep" > /dev/null || compgen -G "infra/*.bicep" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Bicep under infra/ yet; Phase 3 writes it. The scan runs on the first file." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.bicep.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: infra
          framework: bicep
          soft_fail: true # reports until Phase 3 makes it a gate (ADR 0019)
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
