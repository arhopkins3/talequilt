<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invited authors only</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
        color: #1b1b1b;
        background: #fff;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 12px;
      }
      a {
        color: #0b57d0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This site is open to invited authors only</h1>
      <p>
        You are signed in with a GitHub account that has not been invited yet. If you were expecting
        access, ask the site owner for an invitation link for this account.
      </p>
      <p>
        <a href="/.auth/logout?post_logout_redirect_uri=/">Sign out</a> to try a different account.
      </p>
    </main>
  </body>
</html>
